[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-guard-ko"
version = "0.1.0"
description = "Find Korean personal data and API keys in files before you publish them"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "junetapa-juncheol"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["pii", "privacy", "korean", "scanner", "redaction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Korean",
    "Topic :: Security",
]

[project.optional-dependencies]
images = ["Pillow>=9"]
test = ["pytest>=7", "Pillow>=9"]

[project.scripts]
pii-guard-ko = "pii_guard_ko.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
